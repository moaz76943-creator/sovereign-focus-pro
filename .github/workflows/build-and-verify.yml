name: Build Production AAB & APK + Full QA Shield

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-verify-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify_and_build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Pre-Commit & 100-Language Integrity Shield
        run: python3 tools/pre_commit_shield.py

      - name: Fetch Verified CC0 / Public Domain Nature Audio Assets (Wikimedia Commons)
        run: |
          mkdir -p assets/audio
          UA="FocusStudioProBuilder/2.0 (https://github.com/moaz76943-creator)"
          curl -fSL -A "$UA" "https://upload.wikimedia.org/wikipedia/commons/4/41/Rain_against_the_window.ogg" -o assets/audio/rain_window.ogg || true
          curl -fSL -A "$UA" "https://upload.wikimedia.org/wikipedia/commons/4/42/Bird_singing.ogg" -o assets/audio/forest_birds.ogg || true
          curl -fSL -A "$UA" "https://upload.wikimedia.org/wikipedia/commons/2/26/Flowing-water-100019.ogg" -o assets/audio/flowing_water.ogg || true
          ls -lh assets/audio/

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Linux SQLite FFI dependencies for unit tests
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-0 libsqlite3-dev

      - name: Set up Pinned Flutter Stable (3.27.4)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: Bootstrap missing Flutter platform scaffolding without overwriting custom files
        run: |
          cp pubspec.yaml /tmp/pubspec.yaml.bak
          cp lib/main.dart /tmp/main.dart.bak
          cp android/settings.gradle /tmp/settings.gradle.bak
          cp android/gradle.properties /tmp/gradle.properties.bak
          cp android/app/proguard-rules.pro /tmp/proguard-rules.pro.bak
          cp android/app/src/main/java/com/moaz/focusstudiopro/MainActivity.java /tmp/MainActivity.java.bak
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml.bak
          cp android/app/build.gradle /tmp/app_build.gradle.bak
          flutter create --org com.moaz --project-name focusstudiopro --platforms=android .
          cp /tmp/pubspec.yaml.bak pubspec.yaml
          cp /tmp/main.dart.bak lib/main.dart
          cp /tmp/settings.gradle.bak android/settings.gradle
          cp /tmp/gradle.properties.bak android/gradle.properties
          cp /tmp/proguard-rules.pro.bak android/app/proguard-rules.pro
          mkdir -p android/app/src/main/java/com/moaz/focusstudiopro
          cp /tmp/MainActivity.java.bak android/app/src/main/java/com/moaz/focusstudiopro/MainActivity.java
          cp /tmp/AndroidManifest.xml.bak android/app/src/main/AndroidManifest.xml
          cp /tmp/app_build.gradle.bak android/app/build.gradle
          rm -rf android/app/src/main/kotlin || true
          rm -f test/widget_test.dart || true

      - name: Install Dart/Flutter dependencies
        run: flutter pub get

      - name: Run Full Automated Test Suite (Before Keystore Generation)
        run: flutter test

      - name: Configure Release Signing (Secrets Preferred, Ephemeral CI Fallback)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/upload-keystore.jks
            ALIAS="${KEY_ALIAS:-upload}"
            KP="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            printf "storePassword=%s
keyPassword=%s
keyAlias=%s
storeFile=upload-keystore.jks
" "$KEYSTORE_PASSWORD" "$KP" "$ALIAS" > android/key.properties
            echo "Using persistent GitHub Secrets keystore for release signing."
          else
            EPHEMERAL_PW=$(openssl rand -hex 16)
            keytool -genkey -v -keystore android/app/upload-keystore.jks               -keyalg RSA -keysize 2048 -validity 365               -alias ci_ephemeral -dname "CN=FocusStudioProCI, OU=Mobile, O=MoazCreator, L=Amman, C=JO"               -storepass "$EPHEMERAL_PW" -keypass "$EPHEMERAL_PW"
            printf "storePassword=%s
keyPassword=%s
keyAlias=ci_ephemeral
storeFile=upload-keystore.jks
" "$EPHEMERAL_PW" "$EPHEMERAL_PW" > android/key.properties
            echo "::warning::Using ephemeral CI keystore for test build. Add KEYSTORE_B64 and KEYSTORE_PASSWORD to GitHub Secrets before Google Play upload."
          fi

      - name: Build Signed Release APK (Android 15, API 35, 120Hz, R8)
        run: flutter build apk --release

      - name: Build Signed Release App Bundle (AAB)
        run: flutter build appbundle --release

      - name: Clean Up Temporary Signing Files
        if: always()
        run: rm -f android/app/upload-keystore.jks android/key.properties

      - name: Package Release Artifacts
        run: |
          mkdir -p release_out
          cp build/app/outputs/flutter-apk/app-release.apk release_out/app-release.apk
          cp build/app/outputs/bundle/release/app-release.aab release_out/app-release.aab
          sha256sum release_out/* > release_out/SHA256SUMS.txt

      - name: Upload Play-Ready AAB & APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: focus-studio-pro-release
          path: release_out/
          retention-days: 30
